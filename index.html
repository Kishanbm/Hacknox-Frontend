<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HackOnX</title>
    <meta name="description" content="India's Multi-State HPC Hackathon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#5425FF',
              secondary: '#24FF00',
              surface: '#FFFFFF',
              background: '#F3F4F6',
            },
            fontFamily: {
              heading: ['Silkscreen', 'cursive'],
              body: ['Figtree', 'sans-serif'],
              // Keeping old fonts for fallback/LandingPage compatibility if needed
              pixel: ['VT323', 'monospace'], 
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Figtree', sans-serif;
        background-color: #F3F4F6;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      /* Floating decoration animations used across auth pages */
      @keyframes float-slow {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes float-medium {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-3deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes float-fast {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      .animate-float-slow { animation: float-slow 10s ease-in-out infinite; }
      .animate-float-medium { animation: float-medium 8s ease-in-out infinite; }
      .animate-float-fast { animation: float-fast 6s ease-in-out infinite; }
    </style>
    <!-- Removed path-to-hash redirect script because the app now uses BrowserRouter (HTML5 history API). -->
  <!-- Removed importmap: production build bundles dependencies. Using importmap caused runtime resolution issues on Vercel. -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
